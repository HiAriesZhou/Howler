name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.scope.outputs.app }}
      core: ${{ steps.scope.outputs.core }}
      interaction: ${{ steps.scope.outputs.interaction }}
      tooling: ${{ steps.scope.outputs.tooling }}
      compile: ${{ steps.scope.outputs.compile }}
      bundle: ${{ steps.scope.outputs.bundle }}
      dmg: ${{ steps.scope.outputs.dmg }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # diff both PR merge-base/head and main before/after; include rename sources
          persist-credentials: false
      - name: Select verification scope
        id: scope
        run: node scripts/ci-scope.mjs --github
      - name: Check CI selection rules
        if: steps.scope.outputs.ci == 'true'
        run: make test-ci

  build-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test core
        if: needs.changes.outputs.core == 'true' && needs.changes.outputs.interaction != 'true'
        run: make test-core

      - name: Test app behavior
        if: needs.changes.outputs.interaction == 'true'
        env:
          CHECK_CORE: ${{ needs.changes.outputs.core }}
        run: |
          if [[ "$CHECK_CORE" == true ]]; then make test-all; else make test-app; fi

      - name: Test release tooling
        if: needs.changes.outputs.tooling == 'true' && !(needs.changes.outputs.core == 'true' && needs.changes.outputs.interaction == 'true')
        run: make test-tooling

      - name: Compile app
        if: needs.changes.outputs.compile == 'true' && needs.changes.outputs.interaction != 'true' && needs.changes.outputs.bundle != 'true'
        run: swift build --product Howler

      # Only full/manual or tagged builds import signing credentials. Ordinary packaging checks are ad-hoc.
      - name: Import signing certificate
        if: needs.changes.outputs.bundle == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12_BASE64" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "error: tagged releases require a Developer ID signing certificate" >&2
              exit 1
            fi
            echo "No signing certificate configured; building ad-hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$IDENTITY" ]]; then
            echo "error: the certificate holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app bundle
        if: needs.changes.outputs.bundle == 'true'
        run: ./scripts/bundle.sh

      - name: Notarization credentials
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGN_IDENTITY != ''
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$NOTARY_KEY_P8_BASE64" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
            echo "error: signed release without notarization credentials; Gatekeeper would still block it" >&2
            exit 1
          fi
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Notarize app
        if: env.NOTARY_KEY_PATH != ''
        run: ./scripts/notarize.sh app

      - name: Build disk image
        if: needs.changes.outputs.dmg == 'true'
        run: ./scripts/dmg.sh

      - name: Notarize disk image
        if: env.NOTARY_KEY_PATH != ''
        run: ./scripts/notarize.sh dmg

      - name: Inspect bundle
        if: needs.changes.outputs.bundle == 'true'
        run: |
          source app.config
          plutil -p "build/stage.noindex/$APP_NAME.app/Contents/Info.plist"
          codesign -dv "build/stage.noindex/$APP_NAME.app" 2>&1
          spctl --assess --type execute --verbose=2 "build/stage.noindex/$APP_NAME.app" 2>&1 || true
          ls -la build

      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.bundle == 'true'
        with:
          name: Howler
          path: |
            build/*.zip
            build/*.dmg
          if-no-files-found: error

  publish-release:
    needs: build-app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: howler-release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Howler
          path: build
      - name: Fetch Sparkle tools
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          echo "SIGN_UPDATE=$RUNNER_TEMP/sparkle/bin/sign_update" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          source app.config
          export APP_NAME BUNDLE_ID VERSION BUILD_NUMBER SPARKLE_FEED_URL
          python3 scripts/release.py

  # Keep the protected-branch check present on content-only PRs and detector failures.
  build:
    needs: [changes, build-app, publish-release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify required results
        env:
          CHANGES: ${{ needs.changes.result }}
          APP_REQUIRED: ${{ needs.changes.outputs.app }}
          APP: ${{ needs.build-app.result }}
          RELEASE_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/v') }}
          RELEASE: ${{ needs.publish-release.result }}
        run: |-
          test "$CHANGES" = success
          if [ "$APP_REQUIRED" = true ]; then
            test "$APP" = success
          else
            test "$APP" = skipped
          fi
          if [ "$RELEASE_REQUIRED" = true ]; then
            test "$RELEASE" = success
          else
            test "$RELEASE" = skipped
          fi

  homebrew:
    needs: build
    if: github.repository == 'HiAriesZhou/Howler' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
