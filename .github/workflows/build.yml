name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: filter
        with:
          script: |
            let app = true;
            if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: context.issue.number, per_page: 100
              });
              // Build on empty/incomplete results and unknown paths, including renames.
              if (files.length > 0 && files.length < 3000) {
                const paths = files.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
                app = paths.some(path => !(/^[^/]+\.md$/.test(path) || path.startsWith('docs/')));
              }
            }
            core.setOutput('app', String(app));

  build-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release on version tags
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          echo "key=$({ xcodebuild -version; swift --version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache Swift build
        # Release builds remain independent of caches from ordinary validation.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Test
        run: swift test

      # With the Developer ID secrets set, builds are signed (and tagged releases notarized);
      # without them, as on forks, everything below falls back to an ad-hoc signature.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12_BASE64" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "error: tagged releases require a Developer ID signing certificate" >&2
              exit 1
            fi
            echo "No signing certificate configured; building ad-hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$IDENTITY" ]]; then
            echo "error: the certificate holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: ./scripts/bundle.sh

      - name: Notarization credentials
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGN_IDENTITY != ''
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$NOTARY_KEY_P8_BASE64" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
            echo "error: signed release without notarization credentials; Gatekeeper would still block it" >&2
            exit 1
          fi
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Notarize app
        if: env.NOTARY_KEY_PATH != ''
        run: ./scripts/notarize.sh app

      - name: Build disk image
        run: ./scripts/dmg.sh

      - name: Notarize disk image
        if: env.NOTARY_KEY_PATH != ''
        run: ./scripts/notarize.sh dmg

      - name: Inspect bundle
        run: |
          source app.config
          plutil -p "build/stage.noindex/$APP_NAME.app/Contents/Info.plist"
          codesign -dv "build/stage.noindex/$APP_NAME.app" 2>&1
          spctl --assess --type execute --verbose=2 "build/stage.noindex/$APP_NAME.app" 2>&1 || true
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: Howler
          path: |
            build/*.zip
            build/*.dmg
          if-no-files-found: error

      # sign_update from the Sparkle release the app embeds (Package.swift pins the same version).
      - name: Fetch Sparkle tools
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          echo "SIGN_UPDATE=$RUNNER_TEMP/sparkle/bin/sign_update" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          source app.config
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "error: tag $GITHUB_REF_NAME does not match VERSION=$VERSION in app.config" >&2
            exit 1
          fi
          # The appcast installed copies poll (SUFeedURL). It is built before anything is published
          # and goes up with the zip and dmg, so the latest release never lacks one.
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "error: SPARKLE_ED_PRIVATE_KEY is not set; installed copies won't be offered this update" >&2
            exit 1
          fi
          # The release page and the in-app update panel use the same authored notes.
          NOTES="docs/releases/$VERSION.md"
          if [[ ! -s "$NOTES" ]] || ! grep -Eq '^[*-] [^[:space:]]' "$NOTES"; then
            echo "error: add user-facing release notes to $NOTES before publishing" >&2
            exit 1
          fi
          ./scripts/appcast.sh "$NOTES"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES"
            gh release upload "$GITHUB_REF_NAME" build/*.zip build/*.dmg build/appcast.xml --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/*.zip build/*.dmg build/appcast.xml \
              --title "$APP_NAME $GITHUB_REF_NAME" --notes-file "$NOTES" --latest
          fi

  # Keep the required check present on docs-only PRs and detector failures.
  build:
    needs: [changes, build-app]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify required results
        env:
          CHANGES: ${{ needs.changes.result }}
          APP_REQUIRED: ${{ needs.changes.outputs.app }}
          APP: ${{ needs.build-app.result }}
        run: |-
          test "$CHANGES" = success
          if [ "$APP_REQUIRED" = true ]; then
            test "$APP" = success
          else
            test "$APP" = skipped
          fi

  homebrew:
    needs: build
    if: github.repository == 'HiAriesZhou/Howler' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
