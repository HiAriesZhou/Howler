name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release on version tags
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      # With the Developer ID secrets set, builds are signed (and tagged releases notarized);
      # without them, as on forks, everything below falls back to an ad-hoc signature.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12_BASE64" ]]; then
            echo "No signing certificate configured; building ad-hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$IDENTITY" ]]; then
            echo "error: the certificate holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: ./scripts/bundle.sh

      - name: Notarization credentials
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGN_IDENTITY != ''
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$NOTARY_KEY_P8_BASE64" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
            echo "error: signed release without notarization credentials; Gatekeeper would still block it" >&2
            exit 1
          fi
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Notarize app
        if: env.NOTARY_KEY_PATH != ''
        run: ./scripts/notarize.sh app

      - name: Build disk image
        run: ./scripts/dmg.sh

      - name: Notarize disk image
        if: env.NOTARY_KEY_PATH != ''
        run: ./scripts/notarize.sh dmg

      - name: Inspect bundle
        run: |
          source app.config
          plutil -p "build/stage.noindex/$APP_NAME.app/Contents/Info.plist"
          codesign -dv "build/stage.noindex/$APP_NAME.app" 2>&1
          spctl --assess --type execute --verbose=2 "build/stage.noindex/$APP_NAME.app" 2>&1 || true
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: Howler
          path: |
            build/*.zip
            build/*.dmg
          if-no-files-found: error

      # sign_update from the Sparkle release the app embeds (Package.swift pins the same version).
      - name: Fetch Sparkle tools
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          echo "SIGN_UPDATE=$RUNNER_TEMP/sparkle/bin/sign_update" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          source app.config
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "error: tag $GITHUB_REF_NAME does not match VERSION=$VERSION in app.config" >&2
            exit 1
          fi
          # The appcast installed copies poll (SUFeedURL). It is built before anything is published
          # and goes up with the zip and dmg, so the latest release never lacks one.
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "error: SPARKLE_ED_PRIVATE_KEY is not set; installed copies won't be offered this update" >&2
            exit 1
          fi
          NOTES="$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$NOTES"
            ./scripts/appcast.sh "$NOTES"
            gh release upload "$GITHUB_REF_NAME" build/*.zip build/*.dmg build/appcast.xml --clobber
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > "$NOTES"
            ./scripts/appcast.sh "$NOTES"
            gh release create "$GITHUB_REF_NAME" build/*.zip build/*.dmg build/appcast.xml \
              --title "$APP_NAME $GITHUB_REF_NAME" --notes-file "$NOTES" --latest
          fi
